site_name: Postcard Migration Docs
site_description: Strapi → PostgreSQL/Prisma migration documentation for Postcard Travel Club

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

hooks:
  - docs_hooks.py

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false

nav:
  - Home: index.md
  - Prerequisites:
      - PostgreSQL Lifecycle: prerequisites/postgresql-lifecycle.md
      - Prisma Guide: prerequisites/prisma-guide.md
  - Get Started:
      - Initialisation: get-started/initialisation.md
      - Seed Scripts: get-started/seed-scripts.md
      - Migration Workflow: get-started/migration-workflow.md
  - Migrations:
      - migrations/index.md
      - 1. Geo Migration: migrations/geo-migration.md
      - "Geo Migration — Notebook": migrations/notebooks/geo_migration.ipynb
      - 2. Media Migration: migrations/media-migration.md
      - 3. Company Migration: migrations/company-migration.md
      - "Media/UserTypes/Companies — Notebook": migrations/notebooks/media_usertypes_companies_migration.ipynb
      - 4. User Migration: migrations/user-migration.md
      - "User Migration — Notebook": migrations/notebooks/user_migration.ipynb
      - 5. Directory & Album Migration: migrations/directory-album-migration.md
      - "Directory/Album — Notebook": migrations/notebooks/directory_album_migration.ipynb
      - 6. Tags Facet Migration: migrations/tags-facet-migration.md
      - "Tags Facet — Notebook": migrations/notebooks/tags_facet_migration.ipynb
      - 7. Postcard Migration: migrations/postcard-migration.md
      - "Postcard — Notebook": migrations/notebooks/postcard_migration.ipynb
      - 8. Journey Migration: migrations/journey-migration.md
      - "Journey — Notebook": migrations/notebooks/journey_migration.ipynb
      - 9. City Guide Migration: migrations/cityguide-migration.md
      - "City Guide — Notebook": migrations/notebooks/cityguide_migration.ipynb
      - 10. Bookmark Migration: migrations/bookmark-migration.md
      - "Bookmark — Notebook": migrations/notebooks/bookmark_migration.ipynb
  - Schema Change Plan:
      - schema-change-plan/index.md
      - "Implementation Report & Runbook": schema-change-plan/implementation.md
      - 00. Cross-cutting Changes: schema-change-plan/00-cross-cutting.md
      - 01. Seed Types: schema-change-plan/01-seed-types.md
      - 02. Geo: schema-change-plan/02-geo.md
      - 03. Media: schema-change-plan/03-media.md
      - 04. Company: schema-change-plan/04-company.md
      - 05. Users: schema-change-plan/05-users.md
      - 06. Directory & Album: schema-change-plan/06-directory-album.md
      - 07. Tags Facet: schema-change-plan/07-tags-facet.md
      - 08. Postcard: schema-change-plan/08-postcard.md
      - 09. Journey: schema-change-plan/09-journey.md
      - 10. City Guide: schema-change-plan/10-cityguide.md
      - 11. Bookmark: schema-change-plan/11-bookmark.md
      - "12. Category & Environment Facet — NEW": schema-change-plan/12-category-environment-facet.md
      - 13. Not Yet Scripted: schema-change-plan/13-not-yet-scripted.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
